services:
  demo:
    build:
      context: ../..
      dockerfile: frontend/Dockerfile
    ports:
      - "${LOU_DEMO_PORT:-8100}:8100"
    environment:
      # Read-only view of persisted runs. The analyze and scenario tabs work
      # without this; only the run history needs it.
      LOU_DATABASE_URL: postgresql+psycopg://lou:${LOU_POSTGRES_RUNTIME_PASSWORD:-lou}@postgres:5432/lou
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Repositories are mounted at their own host path so a path typed into the
      # page resolves to the same place inside the container. Read-only: the
      # analysis stages this serves only read.
      - "${LOU_DEMO_REPOS:-${HOME}/Projects}:${LOU_DEMO_REPOS:-${HOME}/Projects}:ro"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8100/')\""]
      interval: 5s
      timeout: 3s
      retries: 12

  staging-demo:
    image: nginx:1.27-alpine
    profiles: ["staging"]
    ports:
      - "${LOU_STAGING_PORT:-8088}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/ >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 10

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest@sha256:799dc6cf12c96192af37b5bdba804da8c10b3bc563b43cb90c3f3c58d9572ad6
    profiles: ["telemetry"]
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    ports:
      - "${LOU_OTEL_HTTP_PORT:-4318}:4318"
      - "${LOU_OTEL_HEALTH_PORT:-13133}:13133"
    volumes:
      - ./otel/collector.yaml:/etc/otelcol-contrib/config.yaml:ro

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lou
      POSTGRES_USER: lou_migrator
      POSTGRES_PASSWORD: ${LOU_POSTGRES_MIGRATOR_PASSWORD:-lou_migrator}
      LOU_RUNTIME_PASSWORD: ${LOU_POSTGRES_RUNTIME_PASSWORD:-lou}
      LOU_TEST_APP_PASSWORD: ${LOU_POSTGRES_TEST_APP_PASSWORD:-lou_test_app}
    ports:
      - "${LOU_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lou_migrator -d lou"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - lou-postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - default
      - fixture

volumes:
  lou-postgres-data:

networks:
  fixture:
    name: lou-fixture
    internal: true
