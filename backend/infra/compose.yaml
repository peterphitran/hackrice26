services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lou
      POSTGRES_USER: lou
      POSTGRES_PASSWORD: lou
    ports:
      - "${LOU_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lou -d lou"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - lou-postgres-data:/var/lib/postgresql/data

volumes:
  lou-postgres-data:
