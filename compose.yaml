services:
  frontend:
    build:
      context: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
    networks:
      - app

  backend:
    build:
      context: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LOU_ENVIRONMENT: ${LOU_ENVIRONMENT:-production}
      LOU_LOG_LEVEL: ${LOU_LOG_LEVEL:-INFO}
      LOU_ARTIFACT_ROOT: /app/.lou/artifacts
      LOU_MIGRATION_DATABASE_URL: "postgresql+psycopg://lou_migrator:${LOU_POSTGRES_MIGRATOR_PASSWORD:-lou_migrator}@postgres:5432/lou"
      LOU_DATABASE_URL: "postgresql+psycopg://lou:${LOU_POSTGRES_RUNTIME_PASSWORD:-lou}@postgres:5432/lou"
      LOU_TEST_DATABASE_URL: "postgresql+psycopg://lou_test_app:${LOU_POSTGRES_TEST_APP_PASSWORD:-lou_test_app}@postgres:5432/lou_test"
      LOU_FIXTURE_DATABASE_URL: "postgresql://lou_migrator:${LOU_POSTGRES_MIGRATOR_PASSWORD:-lou_migrator}@postgres:5432/lou"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - app
    volumes:
      - lou-artifacts:/app/.lou/artifacts

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lou
      POSTGRES_USER: lou_migrator
      POSTGRES_PASSWORD: ${LOU_POSTGRES_MIGRATOR_PASSWORD:-lou_migrator}
      LOU_RUNTIME_PASSWORD: ${LOU_POSTGRES_RUNTIME_PASSWORD:-lou}
      LOU_TEST_APP_PASSWORD: ${LOU_POSTGRES_TEST_APP_PASSWORD:-lou_test_app}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lou_migrator -d lou"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - app
      - fixture
    volumes:
      - lou-postgres-data:/var/lib/postgresql/data
      - ./backend/infra/postgres/init:/docker-entrypoint-initdb.d:ro

volumes:
  lou-artifacts:
  lou-postgres-data:

networks:
  app:
  fixture:
    name: lou-fixture
    internal: true
